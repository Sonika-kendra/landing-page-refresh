<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Background -->
  <rect width="300" height="300" fill="#F9F7F4"/>

  <!-- Outer subtle ring decoration -->
  <circle cx="150" cy="138" r="72" stroke="#C3AC88" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- Ring band (bottom arc) -->
  <path d="M110 195 Q150 215 190 195" stroke="#C3AC88" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M116 199 Q150 220 184 199" stroke="#C3AC88" stroke-width="1.2" stroke-linecap="round" opacity="0.3"/>

  <!-- Diamond gem shape -->
  <!-- Top crown facets -->
  <polygon points="150,72 175,102 150,102 125,102" fill="#C3AC88" opacity="0.18"/>
  <!-- Left top facet -->
  <polygon points="150,72 125,102 132,84" fill="#C3AC88" opacity="0.28"/>
  <!-- Right top facet -->
  <polygon points="150,72 175,102 168,84" fill="#C3AC88" opacity="0.22"/>
  <!-- Center top facet -->
  <polygon points="150,72 168,84 132,84" fill="#C3AC88" opacity="0.32"/>

  <!-- Bottom pavilion -->
  <polygon points="125,102 150,102 175,102 150,178" fill="#C3AC88" opacity="0.12"/>
  <!-- Left pavilion -->
  <polygon points="125,102 150,178 137,140" fill="#C3AC88" opacity="0.22"/>
  <!-- Right pavilion -->
  <polygon points="175,102 150,178 163,140" fill="#C3AC88" opacity="0.16"/>
  <!-- Center pavilion -->
  <polygon points="150,102 163,140 137,140" fill="#C3AC88" opacity="0.28"/>

  <!-- Outline of the diamond -->
  <polygon points="150,72 175,102 150,178 125,102" stroke="#C3AC88" stroke-width="1.5" stroke-linejoin="round" fill="none" opacity="0.7"/>
  <!-- Girdle line -->
  <line x1="125" y1="102" x2="175" y2="102" stroke="#C3AC88" stroke-width="1" opacity="0.55"/>
  <!-- Crown facet lines -->
  <line x1="150" y1="72" x2="150" y2="102" stroke="#C3AC88" stroke-width="0.8" opacity="0.4"/>
  <line x1="132" y1="84" x2="168" y2="84" stroke="#C3AC88" stroke-width="0.8" opacity="0.4"/>
  <!-- Pavilion facet lines -->
  <line x1="137" y1="140" x2="163" y2="140" stroke="#C3AC88" stroke-width="0.8" opacity="0.35"/>
  <line x1="137" y1="140" x2="150" y2="178" stroke="#C3AC88" stroke-width="0.8" opacity="0.35"/>
  <line x1="163" y1="140" x2="150" y2="178" stroke="#C3AC88" stroke-width="0.8" opacity="0.35"/>

  <!-- Label -->
  <text x="150" y="242" text-anchor="middle" font-size="10.5" fill="#C3AC88" opacity="0.65" font-family="'Georgia', serif" letter-spacing="2.5">NO IMAGE</text>
</svg>
